services:
  mitmproxy:
    # 공식 이미지. mitmdump 가 entrypoint.
    image: mitmproxy/mitmproxy:latest
    container_name: mitm-cache
    restart: unless-stopped

    # mitmdump 는 stdout 출력을 위해 TTY 가 필요하다.
    # 이게 없으면 컨테이너는 정상 실행되지만 docker logs 가 텅 빈다.
    tty: true

    environment:
      # 동작 모드:
      #   allow (허용, 기본) — 캐시 미스 시 실서버 접근 후 응답을 캐시에 저장
      #   block (차단)       — 캐시 미스 시 504 반환, 실서버 접근 안 함
      # 사용 예:
      #   docker compose down && docker compose up -d                         # ALLOW(허용)
      #   docker compose down && MITM_CACHE_MODE=block docker compose up -d   # BLOCK(차단)
      - MITM_CACHE_MODE=${MITM_CACHE_MODE:-allow}

    ports:
      # 로컬 클라이언트만 접속하도록 loopback에 바인딩한다.
      - "127.0.0.1:8080:8080"

    volumes:
      # addon 스크립트 (읽기 전용)
      - ./cache_addon.py:/work/cache_addon.py:ro

      # 캐시 대상 사이트 목록 (읽기 전용). addon 이 시작 시 파싱해서
      # 화이트리스트로 사용한다.
      - ./target-sites.txt:/work/target-sites.txt:ro

      # 캐시 디렉토리 (영속). 컨테이너 안에서 ./cache 가 곧 호스트의 ./cache 가 된다.
      - ./cache:/work/cache

      # CA 디렉토리. mitmproxy 의 confdir (~/.mitmproxy) 자리.
      # 첫 실행 시 설치별 CA를 생성하고 이후 실행에서 재사용한다.
      - ./ca:/home/mitmproxy/.mitmproxy

      # mitmproxy 옵션 파일. confdir 안의 config.yaml 은 mitmdump 가 시작 시
      # 자동으로 로드한다. 별도 --conf 옵션이 필요하지 않다.
      - ./config.yaml:/home/mitmproxy/.mitmproxy/config.yaml:ro

    working_dir: /work

    # 옵션은 전부 config.yaml 에서 자동 로드된다.
    # 여기서는 addon 로드만 명시한다.
    command:
      - mitmdump
      - -s
      - cache_addon.py

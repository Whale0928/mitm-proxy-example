services:
  mitmproxy:
    # 공식 이미지. mitmdump 가 entrypoint.
    image: mitmproxy/mitmproxy:latest
    container_name: mitm-cache
    restart: unless-stopped

    # mitmdump 는 stdout 출력을 위해 TTY 가 필요하다.
    # 이게 없으면 컨테이너는 정상 실행되지만 docker logs 가 텅 빈다.
    tty: true

    ports:
      # 호스트의 8080 -> 컨테이너 8080. 시스템 프록시를 127.0.0.1:8080 으로 잡으면 된다.
      - "8080:8080"

    volumes:
      # addon 스크립트 (읽기 전용)
      - ./cache_addon.py:/work/cache_addon.py:ro

      # 캐시 디렉토리 (영속). 컨테이너 안에서 ./cache 가 곧 호스트의 ./cache 가 된다.
      - ./cache:/work/cache

      # CA 디렉토리. mitmproxy 의 confdir (~/.mitmproxy) 자리.
      # 컨테이너 안의 mitmproxy 가 이 디렉토리에서 인증서를 읽는다.
      - ./ca:/home/mitmproxy/.mitmproxy

      # mitmproxy 옵션 파일. confdir 안의 config.yaml 은 mitmdump 가 시작 시
      # 자동으로 로드한다. 별도 --conf 옵션이 필요하지 않다.
      - ./config.yaml:/home/mitmproxy/.mitmproxy/config.yaml:ro

    working_dir: /work

    # 옵션은 전부 config.yaml 에서 자동 로드된다.
    # 여기서는 addon 로드만 명시한다.
    command:
      - mitmdump
      - -s
      - cache_addon.py

# mitmproxy 옵션 파일.
#
# Compose가 ~/.mitmproxy/config.yaml에 마운트하면 자동으로 로드된다.
# command-line 의 --set / --ignore-hosts / --allow-hosts 등을 모두 여기에
# yaml 형태로 모아둘 수 있어 관리가 편하다.

# ─────────────────────────────────────────────────────────────
# 캐시 대상 사이트 (whitelist)
# ─────────────────────────────────────────────────────────────
# 이 정규식들 중 하나에 매칭되는 호스트만 mitmproxy 가 가로챈다.
# 나머지 트래픽 (Discord, iCloud, OS 백그라운드 등) 은 그대로 흘려보낸다.
#
# 중요: mitmproxy 는 "host:port" 형태 문자열에 매칭한다. 즉 패턴이
#   engadget.com
# 이 아니라
#   engadget.com:443
# 과 같은 입력에 대해 비교된다. 포트를 빼먹으면 매칭이 전혀 안 된다.
#
# 각 패턴은 아래 형태로 작성한다:
#   ^(.+\.)?example\.com:\d+$
# - `^(.+\.)?`   : www, m, news, finance 등 모든 서브도메인 허용 (없어도 OK)
# - `example\.com` : 실제 도메인 (점 이스케이프 필요)
# - `:\d+$`      : 모든 포트 (80/443 등) 허용
#
# allow_hosts 에 걸린 호스트만 mitmproxy 가 TLS 를 가로채 addon 으로 넘긴다.
# 나머지(네이버/카카오/은행앱/OS 백그라운드 등)는 CONNECT 단계에서 암호화된
# 터널을 그대로 통과시키므로 가짜 인증서를 내밀지 않는다 → cert pinning 깨짐
# 없음.
# (addon 의 target-sites.txt 화이트리스트는 그대로 유지해 이중 안전장치로 둔다)
allow_hosts:
  - ^(.+\.)?engadget\.com:\d+$
  - ^(.+\.)?gizmodo\.com:\d+$
  - ^(.+\.)?marktechpost\.com:\d+$
  - ^(.+\.)?mit\.edu:\d+$
  - ^(.+\.)?theverge\.com:\d+$
  - ^(.+\.)?tomshardware\.com:\d+$
  - ^(.+\.)?wccftech\.com:\d+$
  - ^(.+\.)?yahoo\.com:\d+$
  - ^(.+\.)?businessinsider\.com:\d+$
  - ^(.+\.)?aibusiness\.com:\d+$
  - ^(.+\.)?artificialintelligence-news\.com:\d+$
  - ^(.+\.)?aitimes\.com:\d+$
  - ^(.+\.)?cnbc\.com:\d+$
  - ^(.+\.)?techcrunch\.com:\d+$
  - ^(.+\.)?trendforce\.com:\d+$
  - ^(.+\.)?venturebeat\.com:\d+$
  - ^(.+\.)?itworld\.co\.kr:\d+$
  - ^(.+\.)?aitimes\.kr:\d+$

# ─────────────────────────────────────────────────────────────
# 캐시 동작 관련 옵션
# ─────────────────────────────────────────────────────────────

# 업스트림 사전 연결 차단. 캐시 HIT 시 네트워크에 안 나가게 하고,
# 오프라인 재생을 가능하게 한다.
connection_strategy: lazy

# 컨테이너 NAT 를 통해 들어오는 호스트 트래픽을 mitmproxy 가
# "외부 악용 시도"로 차단하지 않도록 푼다.
block_global: false

# mitmproxy 자체 로그 레벨. info 면 connect/disconnect 가 화면을 도배하므로
# warn 으로 올려서 우리 addon 의 [HIT]/[MISS]/[SAVE] 만 깔끔히 보이게 한다.
termlog_verbosity: warn

# 요청별 한 줄 flow 요약 출력 비활성화 (0 = 출력 안 함).
flow_detail: 0
